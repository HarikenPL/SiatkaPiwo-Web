<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiatkaPiwo</title>
	<link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#F57C00">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SiatkaPiwo">
    
    <style>
        /* ZMIENNE KOLORYSTYCZNE - DOMYŚLNIE JASNY MOTYW */
        :root {
            --bg-color: #f4f4f9;
            --text-color: #333333;
            --card-bg: #ffffff;
            --border-color: #cccccc;
            --input-bg: #ffffff;
        }

        /* JEŚLI SYSTEM JEST W TRYBIE CIEMNYM - PODMIENIAMY KOLORY */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --text-color: #e0e0e0;
                --card-bg: #1e1e1e;
                --border-color: #333333;
                --input-bg: #2c2c2c;
            }
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            transition: background-color 0.3s, color 0.3s; /* Płynne przejście */
        }
        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        input {
            width: 100%;
            height: 50px;
            margin-bottom: 15px;
            padding: 10px;
            font-size: 16px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-color);
            border-radius: 8px;
        }
        button {
            width: 100%;
            height: 55px;
            background-color: #F57C00;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 10px;
        }
        button.logout-btn { background-color: #757575; margin-top: 20px; }
        #message { margin-top: 15px; font-weight: bold; }
        
        .ekran { display: none; }
        .aktywny { display: block; }

        .kafelek-wydarzenia {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            text-align: left;
            border-left: 5px solid #388E3C;
        }
        .kafelek-tytul { font-size: 18px; font-weight: bold; margin-bottom: 5px; color: #1976D2;}
        .kafelek-detale { font-size: 14px; margin-bottom: 3px; color: var(--text-color); opacity: 0.8;}
        .kafelek-badge { 
            display: inline-block; 
            background-color: var(--border-color); 
            color: var(--text-color);
            padding: 3px 8px; 
            border-radius: 12px; 
            font-size: 12px; 
            margin-top: 5px;
            font-weight: bold;
        }
        
        /* Tło dla szczegółów */
        #szczegolyTresc {
            background-color: var(--card-bg);
            color: var(--text-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 style="color: #F57C00;">SiatkaPiwo</h1>

<div id="ekranLogowania" class="ekran">
    <p>Zaloguj się do systemu</p>
    <input type="text" id="login" placeholder="Twój login">
    <input type="password" id="haslo" placeholder="Twoje hasło">
    <button onclick="zaloguj()">ZALOGUJ SIĘ</button>
    <div id="message"></div>
</div>

<div id="ekranGlowny" class="ekran">
    <picture>
        <source srcset="logo.png" media="(prefers-color-scheme: dark)">
        <img src="logo_white.png" alt="SiatkaPiwo Logo" style="width: 130px; height: auto; margin: 0 auto 15px auto; display: block;">
    </picture>
    <h2 id="powitanieUsera">Cześć!</h2>
    
    <div id="listaWydarzen">
        <p>Ładowanie wydarzeń...</p>
    </div>
    <button class="logout-btn" onclick="wyloguj()">WYLOGUJ SIĘ</button>
</div>

    </div>

 <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwBiHv4GuJJwbpV-L8O5oXe-cdK7W0nlGnVG8DC1MDHVNBW4au2nt_W65Ab12S_G00I/exec";

        let aktualneWydarzenieId = null;
        let czyJestemZapisany = false;
        let jestemOrganizatorem = false;

        async function hashujHaslo(haslo) {
            const msgBuffer = new TextEncoder().encode(haslo);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            return hashHex;
        }

        window.onload = function() {
            sprawdzSesje();
        };

        function sprawdzSesje() {
            const mojeId = localStorage.getItem('mojeId');
            const mojeImie = localStorage.getItem('mojeImie');

            if (mojeId && mojeImie) {
                document.getElementById('powitanieUsera').innerText = "Cześć, " + mojeImie + "!";
                pokazEkran('ekranGlowny');
                pobierzWydarzenia(mojeId);
            } else {
                pokazEkran('ekranLogowania');
            }
        }

        function pokazEkran(idEkranu) {
            document.getElementById('ekranLogowania').classList.remove('aktywny');
            document.getElementById('ekranGlowny').classList.remove('aktywny');
            document.getElementById('ekranSzczegolow').classList.remove('aktywny');
            document.getElementById(idEkranu).classList.add('aktywny');
        }

        async function zaloguj() {
            const login = document.getElementById('login').value;
            const haslo = document.getElementById('haslo').value;
            const msgDiv = document.getElementById('message');

            if(!login || !haslo) {
                msgDiv.style.color = "red";
                msgDiv.innerText = "Podaj login i hasło!";
                return;
            }

            msgDiv.style.color = "black";
            msgDiv.innerText = "Logowanie...";

            try {
                const zahashowaneHaslo = await hashujHaslo(haslo);
                const payload = { action: "logowanie", login: login, haslo: zahashowaneHaslo };

                fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) })
                .then(response => response.json())
                .then(data => {
                    if(data.status === "success") {
                        localStorage.setItem('mojeId', data.id);
                        localStorage.setItem('mojeImie', data.imie);
                        sprawdzSesje(); 
                        document.getElementById('haslo').value = ""; 
                    } else {
                        msgDiv.style.color = "red";
                        msgDiv.innerText = "Błąd: " + data.message;
                    }
                })
                .catch(error => {
                    msgDiv.style.color = "red";
                    msgDiv.innerText = "Błąd połączenia z serwerem.";
                });
            } catch (err) {
                msgDiv.style.color = "red";
                msgDiv.innerText = "Błąd wewnętrzny kryptografii.";
            }
        }

        function wyloguj() {
            localStorage.clear();
            document.getElementById('message').innerText = "";
            sprawdzSesje();
        }

        function pobierzWydarzenia(idUzytkownika) {
            const listaDiv = document.getElementById('listaWydarzen');
            listaDiv.innerHTML = "<p>Ładowanie wydarzeń...</p>";

            const payload = { action: "get_all_events_extended", id_uzytkownika: idUzytkownika };

            fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) })
            .then(response => response.json())
            .then(data => {
                if(data.status === "success") {
                    wyrenderujKafelki(data.wydarzenia);
                } else {
                    listaDiv.innerHTML = "<p style='color:red;'>Błąd pobierania danych.</p>";
                }
            })
            .catch(error => {
                listaDiv.innerHTML = "<p style='color:red;'>Błąd połączenia.</p>";
            });
        }

        function wyrenderujKafelki(wydarzenia) {
            const listaDiv = document.getElementById('listaWydarzen');
            listaDiv.innerHTML = "";

            if(!wydarzenia || wydarzenia.length === 0) {
                listaDiv.innerHTML = "<p>Brak zaplanowanych wydarzeń.</p>";
                return;
            }

            wydarzenia.forEach(wyd => {
                const limitTekst = wyd.limit > 0 ? wyd.limit : "Bez limitu";
                const borderKolor = wyd.status === "Zakończone" ? "#9E9E9E" : "#388E3C";
                const czyZapisanyTekst = wyd.czy_zapisany ? "<span style='color:#388E3C;'>Zapisany</span>" : "Brak zapisu";

                const htmlKafelka = `
                    <div class="kafelek-wydarzenia" style="border-left-color: ${borderKolor}; cursor: pointer;" onclick="otworzSzczegoly('${wyd.id_wydarzenia}')">
                        <div class="kafelek-tytul">${wyd.nazwa}</div>
                        <div class="kafelek-detale">📅 ${wyd.data}</div>
                        <div class="kafelek-detale">📍 ${wyd.miejsce}</div>
                        
                        <div class="kafelek-badge">Zapisanych: ${wyd.zapisanych} / ${limitTekst}</div>
                        <div class="kafelek-badge">${czyZapisanyTekst}</div>
                    </div>
                `;
                listaDiv.innerHTML += htmlKafelka;
            });
        }

        function otworzSzczegoly(idWydarzenia) {
            aktualneWydarzenieId = idWydarzenia;
            const mojeId = localStorage.getItem('mojeId');
            const trescDiv = document.getElementById('szczegolyTresc');
            const btnZapisz = document.getElementById('btnZapiszSie');
            
            trescDiv.innerHTML = "<p>Ładowanie szczegółów...</p>";
            btnZapisz.style.display = "none";
            pokazEkran('ekranSzczegolow');

            const payload = { action: "get_event_details", id_wydarzenia: idWydarzenia, id_uzytkownika: mojeId };

            fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) })
            .then(res => res.json())
            .then(data => {
                try {
                    if(data.status === "success") {
                        const r = data.raw_data || {};
                        czyJestemZapisany = data.czy_zapisany;
                        jestemOrganizatorem = data.czy_organizator;
                        
                        const kosztNum = parseFloat(r.koszt.replace(",", ".")) || 0.0;
                        const uczestnicyArray = data.uczestnicy || [];
                        let wszystkichAktywnych = 0;
                        
                        uczestnicyArray.forEach(p => {
                            if (!p.startsWith("Rezerwa")) wszystkichAktywnych++;
                        });

                        let aktualnyKosztZaOsobe = kosztNum;
                        const czyCenaDynamiczna = r.typ_ceny.toLowerCase().includes("alość") || r.typ_ceny.toLowerCase().includes("alosc");
                        
                        if (czyCenaDynamiczna && wszystkichAktywnych > 0) {
                            aktualnyKosztZaOsobe = Math.ceil((kosztNum / wszystkichAktywnych) * 2) / 2.0;
                        }

                        const listaZapisanych = (uczestnicyArray.length > 0) 
                            ? uczestnicyArray.join('\n') 
                            : "Brak zapisanych graczy";
                        
                        trescDiv.innerHTML = `
                            <h2 style="color: #1976D2; margin-top: 0;">${r.nazwa || "Brak nazwy"}</h2>
                            <p>📍 <strong>Miejsce:</strong> ${r.miejsce || "Nieznane"}</p>
                            <p>📅 <strong>Data:</strong> ${r.data || "Brak"}</p>
                            <p>👤 <strong>Organizator:</strong> ${data.organizator || "Nieznany"}</p>
                            ${data.telefon_organizatora ? `<p>📞 <strong>BLIK:</strong> ${data.telefon_organizatora}</p>` : ''}
                            <p>💰 <strong>Koszt:</strong> ${r.typ_ceny} (${aktualnyKosztZaOsobe.toFixed(2)} zł / os.)</p>
                            <p>📝 <strong>Uwagi:</strong> ${r.uwagi || 'Brak'}</p>
                            <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 15px 0;">
                            <div id="rachunekWeb" style="padding: 10px; border-radius: 8px; margin-bottom: 15px; font-weight: bold;"></div>
                            <h3>Lista graczy (${uczestnicyArray.length}):</h3>
                            <p style="white-space: pre-wrap; font-size: 14px; line-height: 1.6; background: var(--bg-color); padding: 10px; border-radius: 8px;">${listaZapisanych}</p>
                        `;

                        przeliczRachunekWeb(data, r.typ_ceny, aktualnyKosztZaOsobe);

                        btnZapisz.style.display = "block";
                        if (data.status_wydarzenia === "Zakończone") {
                            btnZapisz.innerText = "MECZ ZAKOŃCZONY";
                            btnZapisz.style.backgroundColor = "#757575";
                            btnZapisz.disabled = true;
                        } else {
                            btnZapisz.disabled = false;
                            btnZapisz.innerText = czyJestemZapisany ? "WYPISZ SIĘ" : "ZAPISZ SIĘ";
                            btnZapisz.style.backgroundColor = czyJestemZapisany ? "#D32F2F" : "#388E3C";
                        }
                    } else {
                        trescDiv.innerHTML = `<p style="color: red;">Błąd: ${data.message}</p>`;
                    }
                } catch(e) {
                    console.error("Błąd podczas renderowania:", e);
                    trescDiv.innerHTML = `<p style="color: red;">Wystąpił błąd wyświetlania danych.</p>`;
                }
            })
            .catch(err => {
                console.error("Błąd sieci:", err);
                trescDiv.innerHTML = `<p style="color: red;">Błąd połączenia z serwerem.</p>`;
            });
        }

        function przeliczRachunekWeb(data, typCeny, kosztOsobowy) {
            const div = document.getElementById('rachunekWeb');
            const czyDarmowe = (typCeny === "Darmowe" || kosztOsobowy <= 0);
            
            if (data.czy_organizator) {
                if (czyDarmowe) {
                    div.innerHTML = "Wydarzenie darmowe";
                    div.style.color = "#388E3C";
                    return;
                }
                const doZebrania = data.ilu_innych_aktywnych * kosztOsobowy;
                const zebrano = data.ilu_innych_oplaconych * kosztOsobowy;
                div.innerHTML = `Jesteś organizatorem.<br>Zbiórka: ${zebrano.toFixed(2)} zł z ${doZebrania.toFixed(2)} zł`;
                div.style.color = (zebrano >= doZebrania && doZebrania > 0) ? "#388E3C" : "#1976D2";
            } else {
                const liczbaMoichBiletow = (data.czy_zapisany ? 1 : 0) + (data.moi_goscie ? data.moi_goscie.length : 0);
                
                if (liczbaMoichBiletow === 0) {
                    div.innerHTML = "Nie grasz w tym meczu";
                    div.style.color = "gray";
                    return;
                }

                if (czyDarmowe) {
                    div.innerHTML = "Koszt: 0.00 zł (Darmowe)";
                    div.style.color = "#388E3C";
                    return;
                }

                const mojeAktywne = (data.czy_ja_aktywny ? 1 : 0) + (data.ilu_moich_aktywnych_gosci || 0);
                const calkowityKoszt = mojeAktywne * kosztOsobowy;
                
                const wplacone = ( (data.moj_status_zaplacil ? 1 : 0) + (data.ile_moich_gosci_zaplacilo || 0) ) * kosztOsobowy;
                const doZaplaty = calkowityKoszt - wplacone;

                let tekst = `Do zapłaty: ${doZaplaty.toFixed(2)} zł`;
                if (wplacone > 0) tekst += `<br><small>(Wpłacono już: ${wplacone.toFixed(2)} zł)</small>`;
                
                div.innerHTML = tekst;
                div.style.color = doZaplaty <= 0 ? "#388E3C" : "#D32F2F";
            }
        }

        function obsluzZapis() {
            const mojeId = localStorage.getItem('mojeId');
            const mojeImie = localStorage.getItem('mojeImie');
            const akcja = czyJestemZapisany ? "leave_event" : "join_event";
            const btnZapisz = document.getElementById('btnZapiszSie');
            
            btnZapisz.innerText = "Przetwarzanie...";
            btnZapisz.disabled = true;

            const payload = { action: akcja, id_wydarzenia: aktualneWydarzenieId, id_uzytkownika: mojeId, imie: mojeImie };

            fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) })
            .then(res => res.json())
            .then(data => {
                otworzSzczegoly(aktualneWydarzenieId);
            });
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => console.log('Service Worker zarejestrowany.', reg))
                    .catch((err) => console.log('Błąd rejestracji Service Workera.', err));
            });
        }
    </script>
</body>
</html>
